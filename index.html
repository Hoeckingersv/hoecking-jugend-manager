<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cageball-Turnier Helfer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: schwarzes Kopfband mit gelber Bande (Vereinsfarben), darunter feste Reiterleiste, ruhige Arbeitsflächen je Bereich */
:root{
  --bg:#ecece8;
  --surface:#ffffff;
  --input:#f6f6f3;
  --ink:#151515;
  --muted:#5d5d56;
  --faint:#8d8d84;
  --line:#d8d8d0;
  --line-strong:#b9b9b0;
  --track:#e4e4dd;
  --yellow:#ffd400;
  --on-yellow:#151515;
  --gold:#7d6000;
  --bar:#d9ad00;
  --focus:#b38a00;
  --band:#141413;
  --band-fg:#ffffff;
  --band-muted:#b4b4aa;
  --band-line:#2c2c29;
  --live:#3ddc84;
  --ok:#17703a; --ok-bg:#e1f1e5; --on-ok:#ffffff;
  --warn:#94570a; --warn-bg:#fbefd8;
  --bad:#b3261e; --bad-bg:#fbe4e1; --on-bad:#ffffff;
  --bad-on-band:#ff9b92;
  --logo-filter:none;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f0e; --surface:#1a1a18; --input:#222220; --ink:#f0f0ea; --muted:#a6a69c; --faint:#77776f;
    --line:#2f2f2b; --line-strong:#4a4a44; --track:#2d2d29;
    --gold:#ffd84a; --bar:#ffd400; --focus:#ffd400;
    --band:#000000; --band-line:#262623;
    --ok:#6fd394; --ok-bg:#15301f; --on-ok:#0f0f0e;
    --warn:#f2b866; --warn-bg:#36280f;
    --bad:#ff8f86; --bad-bg:#3a1916; --on-bad:#0f0f0e;
    --logo-filter:invert(1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f0e; --surface:#1a1a18; --input:#222220; --ink:#f0f0ea; --muted:#a6a69c; --faint:#77776f;
  --line:#2f2f2b; --line-strong:#4a4a44; --track:#2d2d29;
  --gold:#ffd84a; --bar:#ffd400; --focus:#ffd400;
  --band:#000000; --band-line:#262623;
  --ok:#6fd394; --ok-bg:#15301f; --on-ok:#0f0f0e;
  --warn:#f2b866; --warn-bg:#36280f;
  --bad:#ff8f86; --bad-bg:#3a1916; --on-bad:#0f0f0e;
  --logo-filter:invert(1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.band :focus-visible,.tabs :focus-visible{outline-color:var(--yellow)}

/* Kopfband */
.band{background:var(--band);color:var(--band-fg);border-bottom:4px solid var(--yellow)}
.hwrap{padding-block:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.toprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--yellow)}
h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(27px,4.6vw,44px);line-height:.98;letter-spacing:.01em;margin:8px 0 10px;text-wrap:balance}
.meta{margin:0;color:var(--band-muted);display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14.5px}
.count{font-family:var(--display);text-align:right;padding-left:18px;border-left:1px solid var(--band-line)}
.cd{display:flex;gap:12px;justify-content:flex-end}
.cd span{display:grid;justify-items:center;min-width:2.4ch}
.cd b{font-size:54px;line-height:.88;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.cd i{font-style:normal;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:600;color:var(--band-muted);margin-top:5px}
.cd-note{margin:9px 0 0;text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:600;color:var(--band-muted)}
.count.done .cd{display:none}
.count.done .cd-note{margin:0;font-size:22px;letter-spacing:.04em;color:var(--yellow)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--band-muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--band-muted)}
.live.on i{background:var(--live);box-shadow:0 0 0 3px rgba(61,220,132,.18)}
.live.busy i{background:var(--yellow)}
.live.off i{background:var(--bad-on-band)}
@media (max-width:600px){
  .hwrap{grid-template-columns:1fr;gap:10px}
  .count{text-align:left;padding-left:0;border-left:0}
  .cd{justify-content:flex-start;gap:14px}
  .cd b{font-size:38px}
  .cd-note{margin-top:6px}
}

/* Reiter */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);box-shadow:0 1px 0 var(--band-line)}
.tabbar{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--band-muted);font-family:var(--display);font-weight:600;font-size:16.5px;text-transform:uppercase;letter-spacing:.05em;padding:12px 11px 9px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--band-fg)}
.tab[aria-selected="true"]{color:var(--band-fg);border-bottom-color:var(--yellow)}
.badge{background:var(--yellow);color:var(--on-yellow);font-family:var(--body);font-size:11.5px;font-weight:700;letter-spacing:0;border-radius:999px;padding:1px 7px;line-height:1.4}

/* Inhalt */
main .wrap{padding-block:22px 72px;display:grid;gap:18px}
#panel{display:grid;gap:18px;min-width:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.block-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:14px}
h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:25px;line-height:1.05;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:20px;line-height:1.1;letter-spacing:.02em;margin:0}
.sub{margin:0;color:var(--muted);font-size:14px}
.note{margin:12px 0 0;color:var(--muted);font-size:13.5px;max-width:70ch}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}

/* Eingaben */
.in{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:7px 9px;line-height:1.3}
.in:hover{border-color:var(--line-strong)}
.in:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.in::placeholder{color:var(--faint)}
.in[readonly]{background:transparent;border-color:transparent}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.in.open{background:var(--warn-bg);border-style:dashed;border-color:var(--warn)}
.in.open::placeholder{color:var(--warn)}
.unit{display:inline-flex;align-items:center;gap:6px}
.unit i{font-style:normal;color:var(--muted);font-size:14px}
.w-xs{width:4rem}.w-num{width:5.6rem}.w-mid{width:9rem}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--line-strong);border-radius:6px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--on-ok);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.chk:disabled{cursor:default}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;flex:none}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 13px/1 var(--body);padding:8px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button:hover:not(:disabled){color:var(--ink)}
.seg button[aria-pressed="true"][data-v="Ja"]{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="Nein"]{background:var(--warn-bg);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="Frei"]{background:var(--track);color:var(--ink)}
.seg button:disabled{cursor:default}
.del{appearance:none;border:0;background:transparent;color:var(--faint);min-width:2rem;height:2rem;border-radius:6px;cursor:pointer;font-size:19px;line-height:1;white-space:nowrap}
.del:hover{color:var(--bad);background:var(--bad-bg)}
.del.arm{background:var(--bad);color:var(--on-bad);font-size:12.5px;font-weight:700;padding:0 9px}
.del-sp{display:block;width:0}
.add{appearance:none;justify-self:start;margin-top:10px;border:1px dashed var(--line-strong);background:transparent;color:var(--ink);font:600 14px var(--body);padding:8px 13px;border-radius:7px;cursor:pointer}
.add:hover{border-color:var(--ink);border-style:solid}
.rows{display:grid;gap:6px}

/* Übersicht */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:920px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile:last-child{grid-column:span 2}}
.tile{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 13px;cursor:pointer;display:grid;gap:7px;align-content:start;min-width:0}
.tile:hover{border-color:var(--ink)}
.tile .k{font:600 12.5px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.tile .v{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:17px;color:var(--muted);font-weight:600}
.tile .v.neg{color:var(--bad)}
.tile .s{font-size:13px;color:var(--muted)}
.bar{display:block;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:3px}
.bar.full i{background:var(--ok)}
.jrow{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.jrow:first-child{border-top:0;padding-top:0}
.jstart{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;text-align:center}
.jmeta{display:inline-flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;white-space:nowrap}
@media (max-width:520px){
  .jrow{grid-template-columns:5.2rem minmax(0,1fr) auto;grid-template-areas:"start label del" "start meta meta"}
  .jrow .jstart{grid-area:start}.jrow .jlabel{grid-area:label}.jrow .jmeta{grid-area:meta}.jrow .del,.jrow .del-sp{grid-area:del}
}
.need{display:grid;grid-template-columns:minmax(0,1fr) auto;margin:0}
.need dt,.need dd{padding:8px 0;border-top:1px solid var(--line);margin:0}
.need dt:first-of-type,.need dd:first-of-type{border-top:0;padding-top:0}
.need dd{text-align:right;font:700 20px/1.1 var(--display);font-variant-numeric:tabular-nums}
.need dt small{display:block;color:var(--muted);font-size:13px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .wide{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:4px;min-width:0}
.field>span,.param>span{font:600 12.5px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.route{display:inline-block;margin-top:12px;color:var(--gold);font-weight:600}

/* Mannschaften */
.params{display:flex;flex-wrap:wrap;gap:12px 22px;padding:12px 14px;background:var(--input);border-radius:8px;margin-bottom:16px}
.param{display:grid;gap:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:600 12.5px var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.r{text-align:right}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}
.jhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:12px}
.kick{background:var(--band);color:var(--yellow);border-radius:8px;padding:6px 10px;text-align:center;font-family:var(--display);line-height:1}
.kick b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kick span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted);margin-top:3px}
.money{text-align:right;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.money b{display:block;font:700 19px/1.1 var(--display);color:var(--ink)}
@media (max-width:520px){.jhead{grid-template-columns:auto minmax(0,1fr)}.money{grid-column:1/-1;text-align:left}}
.trow{display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto 4.6rem auto;gap:8px;align-items:center}
.tno{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right}
.fee{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.fee.frei{color:var(--muted);font-weight:400}
@media (max-width:560px){
  .trow{grid-template-columns:1.5rem minmax(0,1fr) auto auto;grid-template-areas:"no name name del" ". seg fee fee";row-gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .trow .tno{grid-area:no}.trow .tname{grid-area:name}.trow .seg{grid-area:seg;justify-self:start}.trow .fee{grid-area:fee}.trow .del,.trow .del-sp{grid-area:del}
}

/* Helfer */
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.hgrid{grid-template-columns:minmax(0,1fr)}}
.hcard h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.hcard h3 small{font:600 13px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.shift{display:grid;grid-template-columns:7.2rem minmax(0,1fr);gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.time{font:700 17px var(--display);font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:420px){.shift{grid-template-columns:minmax(0,1fr)}}

/* Listen */
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:22px 0 10px}
.block-head+.ghead{margin-top:0}
.erow{display:grid;grid-template-columns:24px minmax(0,1.4fr) 5.2rem 5.6rem minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.erow.done .art,.crow.done .task{text-decoration:line-through;color:var(--muted)}
.calc{padding:7px 9px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hint{grid-column:2/-1;font-size:12.5px;color:var(--muted);margin:-2px 0 4px}
.colhead{display:grid;gap:8px;font:600 12px var(--display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:4px}
@media (max-width:640px){
  .erow{grid-template-columns:24px 4.6rem 5rem minmax(0,1fr) auto;grid-template-areas:"chk art art art del" ". men ein zus zus";padding-bottom:8px;border-bottom:1px solid var(--line)}
  .erow .chk{grid-area:chk}.erow .art{grid-area:art}.erow .men{grid-area:men}.erow .ein{grid-area:ein}.erow .zus{grid-area:zus}.erow .del,.erow .del-sp{grid-area:del}
  .erow .hint{grid-column:2/-1}
}
.crow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,13rem) auto;gap:6px 8px;align-items:center}
@media (max-width:560px){
  .crow{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"chk task del" ". zus zus";padding-bottom:8px;border-bottom:1px solid var(--line)}
  .crow .chk{grid-area:chk}.crow .task{grid-area:task}.crow .zus{grid-area:zus}.crow .del,.crow .del-sp{grid-area:del}
}
.krow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.85fr) minmax(0,1.15fr) minmax(0,1fr) 2rem;gap:6px;align-items:center}
.krow.nt{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr) 2rem}
.kteam{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow.colhead{margin-bottom:2px}
@media (max-width:760px){
  .krow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:"name name del" "ap tel tel" "mail notiz notiz";padding-bottom:10px;border-bottom:1px solid var(--line)}
  .krow .k-name{grid-area:name}.krow .k-ap{grid-area:ap}.krow .k-tel{grid-area:tel}.krow .k-mail{grid-area:mail}.krow .k-notiz{grid-area:notiz}.krow .del,.krow .del-sp{grid-area:del}
  .krow.nt{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:"name name del" "ap mail mail" "notiz notiz notiz"}
  .krow.colhead{display:none}
}

/* Bilanz */
.bil{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.bil{grid-template-columns:minmax(0,1fr)}}
.bline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.bline .lbl{font-weight:600}
.bline .amt{text-align:right;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.bline .f{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--muted);font-size:14px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bsum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;font:700 21px var(--display);text-transform:uppercase;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.result{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 20px;background:var(--band);color:var(--band-fg);border-radius:10px;padding:18px 20px;border-bottom:4px solid var(--yellow)}
.result .k{font:700 21px var(--display);text-transform:uppercase;letter-spacing:.04em}
.result .k small{display:block;font:500 13.5px var(--body);text-transform:none;letter-spacing:0;color:var(--band-muted);margin-top:2px}
.result b{font:700 46px/1 var(--display);color:var(--yellow);font-variant-numeric:tabular-nums}
.result b.neg{color:var(--bad-on-band)}

/* Verlauf */
#log{min-width:0}
.log{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.log-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-width:0}
.log-k{font:700 13px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--on-yellow);background:var(--yellow);border-radius:4px;padding:2px 7px;flex:none}
.log-last{flex:1 1 260px;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;color:var(--muted)}
.log-last b{color:var(--ink);font-weight:600}
.log-x{color:var(--ink);overflow-wrap:anywhere}
.log-need{color:var(--warn);font-weight:600}
.log-btn{appearance:none;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font:600 13px var(--body);padding:6px 11px;border-radius:7px;cursor:pointer;margin-left:auto;flex:none}
.log-btn:hover{border-color:var(--ink)}
.ava{width:20px;height:20px;border-radius:50%;flex:none;object-fit:cover;background:var(--track);display:inline-block}
.log-body{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}
.alias{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.alias>span{font:600 12.5px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.alias .in{width:15rem;max-width:100%}
.log-list{list-style:none;margin:0;padding:0;display:grid;max-height:380px;overflow-y:auto}
.log-list li{display:grid;grid-template-columns:20px minmax(0,9rem) 7.6rem auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.log-list li:first-child{border-top:0}
.log-list .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-list .t{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--track);color:var(--ink);white-space:nowrap;justify-self:start}
.log-list .x{overflow-wrap:anywhere}
@media (max-width:640px){
  .log-list li{grid-template-columns:20px minmax(0,1fr) auto;grid-template-areas:"a who t" ". chip chip" ". x x"}
  .log-list .ava{grid-area:a}.log-list .who{grid-area:who}.log-list .t{grid-area:t}.log-list .chip{grid-area:chip}.log-list .x{grid-area:x}
}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:920px){.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.four .tile:last-child{grid-column:auto}}

.empty-state{padding:16px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--muted)}
.notice p{max-width:62ch;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--band-fg);border-left:4px solid var(--yellow);padding:11px 15px;border-radius:8px;width:max-content;max-width:calc(100% - 32px);z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14.5px}
@media (prefers-reduced-motion: no-preference){
  .live.busy i{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .toast{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translate(-50%,8px);opacity:0}}
}

<script>
/* Reine Rechenlogik (ohne DOM), entspricht den Formeln der Excel-Tabelle */
window.TC = (function () {
  'use strict';
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
  const sum = a => a.reduce((x, y) => x + y, 0);
  const filled = s => String(s == null ? '' : s).trim() !== '';
  const named = t => filled(t.name);
  function fee(t, Z) {
    if (!named(t) || t.bezahlt === 'Frei') return 0;
    const b = String(Z.befreit || '').trim().toLowerCase();
    if (b && String(t.name).toLowerCase().includes(b)) return 0;
    return num(Z.startgeld);
  }
  function calc(st) {
    const Z = st.zahlen || {};
    const jug = (st.turnier && Array.isArray(st.turnier.jugenden)) ? st.turnier.jugenden : [];
    const teams = (st.teams || []).filter(named);
    const f = t => fee(t, Z);
    const perJ = jug.map(j => {
      const ts = teams.filter(t => t.jugend === j.key);
      const soll = sum(ts.map(f));
      const ein = sum(ts.filter(t => t.bezahlt === 'Ja').map(f));
      return { key: j.key, label: j.label, n: ts.length, soll, ein, offen: soll - ein,
        medaillen: ts.length * num(Z.medaillenProTeam), pokale: num(Z.pokaleProJugend),
        offeneTeams: ts.filter(t => f(t) > 0 && t.bezahlt !== 'Ja').length };
    });
    const soll = sum(teams.map(f));
    const ein = sum(teams.filter(t => t.bezahlt === 'Ja').map(f));
    const nTeams = teams.length;
    const zahlende = teams.filter(t => f(t) > 0).length;
    const medaillen = nTeams * num(Z.medaillenProTeam);
    const pokale = jug.length * num(Z.pokaleProJugend);
    const kuchen = jug.length * num(Z.kuchenProJugend);
    const semmelRicht = nTeams * num(Z.semmelnProTeam);
    const posten = st.posten || [];
    const E = {
      startgeld: soll,
      sponsor: num(Z.sponsor),
      semmeln: num(Z.anzahlSemmeln) * num(Z.preisSemmel),
      brezen: num(Z.anzahlBrezen) * num(Z.preisBreze),
      kuchen: kuchen * num(Z.stueckeProKuchen) * num(Z.preisKuchenstueck),
      kaffee: num(Z.anzahlKaffee) * num(Z.preisKaffee),
      getraenke: num(Z.flaschen) * num(Z.gewinnFlasche),
      weitere: sum(posten.filter(p => p.art === 'ein').map(p => num(p.betrag)))
    };
    const A = {
      halle: num(Z.hallenmiete),
      medaillen: medaillen * num(Z.preisMedaille),
      semmeln: num(Z.anzahlSemmeln) / 10 * num(Z.einkaufPro10Semmeln),
      weitere: sum(posten.filter(p => p.art === 'aus').map(p => num(p.betrag)))
    };
    const einnahmen = sum(Object.values(E));
    const ausgaben = sum(Object.values(A));
    const helfer = st.helfer || [];
    const slots = helfer.length * 2;
    const besetzt = sum(helfer.map(h => (filled(h.p1) ? 1 : 0) + (filled(h.p2) ? 1 : 0)));
    const einkauf = st.einkauf || [];
    const check = st.checkliste || [];
    return {
      perJ, soll, ein, offen: soll - ein, nTeams, zahlende, medaillen, pokale, kuchen, semmelRicht,
      offeneTeams: teams.filter(t => f(t) > 0 && t.bezahlt !== 'Ja').length,
      E, A, einnahmen, ausgaben, ergebnis: einnahmen - ausgaben,
      slots, besetzt,
      einkaufN: einkauf.length, besorgt: einkauf.filter(e => e.besorgt === true).length,
      checkN: check.length, erledigt: check.filter(c => c.erledigt === true).length
    };
  }
  return { calc, fee, num };
})();
</script>

<script>
(function () {
  'use strict';
  const MODE = window.PLAN_MODE === 'helfer' ? 'helfer' : 'orga';
  const TABS = [['uebersicht', 'Übersicht'], ['mannschaften', 'Mannschaften'], ['helfer', 'Helfer'], ['einkauf', 'Einkauf'], ['checkliste', 'Checkliste'], ['kontakte', 'Kontakte'], ['bilanz', 'Bilanz']].filter(t => MODE !== 'helfer' || t[0] !== 'bilanz');
  const KATS = ['Getränke', 'Essen', 'Süßigkeiten', 'Sonstiges'];

  const TP = 'einstellungen/turnier', ZP = 'einstellungen/zahlen';
  const PAY = { Ja: 'Bezahlt', Nein: 'Offen', Frei: 'Frei' };
  const S = { db: null, conn: 'connecting', readOnly: false, writeKnown: false, saving: 0, turnier: null, zahlen: null, loaded: {},
    teams: [], kontakte: [], helfer: [], einkauf: [], checkliste: [], posten: [],
    uid: null, verlauf: [], personen: {}, logOpen: false, stand: null };
  const DOCS = new Map();
  const NAMES = {};
  let USER = null, lastLog = '';
  const queues = new Map();
  const $ = s => document.querySelector(s);
  const num = TC.num;
  let tab = initialTab();
  let pendingFocus = null, composing = false, rafId = 0, lastPanel = '', lastHdr = '', lastTabs = '';

  /* ---------- Format ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function eur(v) { v = num(v); const r = Math.round(v * 100) / 100; return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', minimumFractionDigits: Number.isInteger(r) ? 0 : 2, maximumFractionDigits: 2 }).format(r); }
  function signed(v) { return (v > 0 ? '+' : '') + eur(v); }
  function fmtIn(v) { return (v == null || v === '' || !isFinite(v)) ? '' : String(v).replace('.', ','); }
  function hid(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return 'f' + (h >>> 0).toString(36); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  const byOrder = (a, b) => (num(a.order) - num(b.order)) || String(a.id).localeCompare(String(b.id));
  const jugList = () => (S.turnier && Array.isArray(S.turnier.jugenden)) ? S.turnier.jugenden : [];
  const nextOrder = arr => arr.reduce((m, x) => Math.max(m, num(x.order)), 0) + 1;

  /* ---------- Bausteine ---------- */
  function inp(path, field, val, o) {
    o = o || {};
    const type = o.type || 'text', key = o.key || (path + '|' + field), isNum = type === 'num';
    const v = isNum ? fmtIn(val) : (val == null ? '' : String(val));
    return `<input id="${hid(key)}" class="in${o.cls ? ' ' + o.cls : ''}${isNum ? ' num' : ''}" type="${isNum ? 'text' : type}"${isNum ? ' inputmode="decimal"' : ''} data-bind data-path="${esc(path)}" data-field="${esc(field)}" data-type="${isNum ? 'num' : 'text'}" data-key="${esc(key)}"${o.jkey ? ` data-jkey="${esc(o.jkey)}"` : ''} value="${esc(v)}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''} aria-label="${esc(o.label || o.ph || field)}" autocomplete="off"${S.readOnly ? ' readonly' : ''}>`;
  }
  function chk(path, field, val, label) {
    const key = path + '|' + field;
    return `<input id="${hid(key)}" class="chk" type="checkbox" data-bind data-path="${esc(path)}" data-field="${esc(field)}" data-type="bool" data-key="${esc(key)}"${val ? ' checked' : ''}${S.readOnly ? ' disabled' : ''} aria-label="${esc(label)}">`;
  }
  function delBtn(path, name, o) {
    if (S.readOnly) return '<span class="del-sp" aria-hidden="true"></span>';
    o = o || {};
    return `<button type="button" class="del" data-act="${o.act || 'del'}"${path ? ` data-path="${esc(path)}"` : ''}${o.jkey ? ` data-jkey="${esc(o.jkey)}"` : ''} aria-label="${esc('Entfernen: ' + (name || 'Eintrag'))}">&times;</button>`;
  }
  function addBtn(act, label, attrs) {
    if (S.readOnly) return '';
    return `<button type="button" class="add" data-act="${act}"${attrs || ''}>+ ${esc(label)}</button>`;
  }
  const unit = (html, u) => `<span class="unit">${html}<i>${u}</i></span>`;

  /* ---------- Verlauf: Änderungen in Worte fassen ---------- */
  const FL = {
    teams: { name: 'Name', bezahlt: 'Startgeld', ansprechpartner: 'Ansprechpartner', telefon: 'Telefon', email: 'E-Mail', notiz: 'Notiz' },
    helfer: { p1: 'Person 1', p2: 'Person 2' },
    einkauf: { artikel: 'Artikel', menge: 'Menge', einheit: 'Einheit', zustaendig: 'Zuständig', besorgt: 'Besorgt' },
    checkliste: { aufgabe: 'Aufgabe', zustaendig: 'Zuständig', erledigt: 'Erledigt' },
    kontakte: { stelle: 'Stelle', ansprechpartner: 'Ansprechpartner', telefon: 'Telefon', email: 'E-Mail', notiz: 'Notiz' },
    posten: { bezeichnung: 'Bezeichnung', betrag: 'Betrag' },
    turnier: { name: 'Turniername', verein: 'Verein', datum: 'Datum', ort: 'Halle', adresse: 'Adresse', modus: 'Spielmodus' },
    zahlen: { startgeld: 'Startgeld je Mannschaft', befreit: 'Startgeldfrei-Regel', medaillenProTeam: 'Medaillen je Mannschaft', pokaleProJugend: 'Pokale je Jugend', semmelnProTeam: 'Semmeln je Mannschaft', kuchenProJugend: 'Kuchen je Jugend', sponsor: 'Sponsor Kellner', anzahlSemmeln: 'Anzahl Semmeln', preisSemmel: 'Preis pro Semmel', anzahlBrezen: 'Anzahl Butterbrezen', preisBreze: 'Preis pro Butterbreze', stueckeProKuchen: 'Stücke pro Kuchen', preisKuchenstueck: 'Preis pro Stück Kuchen', anzahlKaffee: 'Anzahl Kaffee', preisKaffee: 'Preis pro Kaffee', flaschen: 'Anzahl Flaschen', gewinnFlasche: 'Gewinn pro Flasche', hallenmiete: 'Hallenmiete', preisMedaille: 'Preis pro Medaille', einkaufPro10Semmeln: 'Semmel-Einkauf je 10 Stück' },
    jug: { start: 'Anstoß', label: 'Name', spielzeit: 'Spielzeit' }
  };
  const AREA = { teams: 'Mannschaften', helfer: 'Helfer', einkauf: 'Einkauf', checkliste: 'Checkliste', kontakte: 'Kontakte', posten: 'Bilanz' };
  const NOUN = { teams: 'Mannschaft', helfer: 'Schicht', einkauf: 'Artikel', checkliste: 'Aufgabe', kontakte: 'Kontakt', posten: 'Posten' };
  const ZTEAM = new Set(['startgeld', 'befreit', 'medaillenProTeam', 'pokaleProJugend']);
  const same = (a, b) => ((a == null || a === '') && (b == null || b === '')) || a === b;
  function short(v, n) { v = String(v); n = n || 40; return v.length > n ? v.slice(0, n - 1) + '…' : v; }
  function shown(v, field) {
    if (v == null || v === '') return 'leer';
    if (field === 'bezahlt') return PAY[v] || String(v);
    if (typeof v === 'number') return fmtIn(v);
    return '„' + short(v) + '“';
  }
  function whatText(label, oldV, newV, field) {
    if (typeof newV === 'boolean') return newV ? `${label} ✓` : `${label} zurückgenommen`;
    if (oldV == null || oldV === '') return `${label} ${shown(newV, field)} eingetragen`;

    return `${label} ${shown(oldV, field)} → ${shown(newV, field)}`;
  }
  function jugLabel(key) { const j = jugList().find(x => x.key === key); return j ? (j.label || 'Jugend') : 'ohne Jugend'; }
  function subjectOf(col, d) {
    d = d || {};
    if (col === 'teams') return `${d.name || 'Mannschaft ohne Namen'} (${jugLabel(d.jugend)})`;
    if (col === 'helfer') return `${d.bereich || 'Helfer'} ${d.schicht || ''}`.trim();
    if (col === 'einkauf') return d.artikel || 'Artikel ohne Namen';
    if (col === 'checkliste') return d.aufgabe ? short(d.aufgabe) : 'Aufgabe ohne Namen';
    if (col === 'kontakte') return d.stelle || 'Kontakt';
    if (col === 'posten') return d.bezeichnung || (d.art === 'ein' ? 'Weitere Einnahme' : 'Weitere Ausgabe');
    return '';
  }
  function describe(path, field, oldV, newV) {
    const col = path.split('/')[0];
    let area, subj = '', label;
    if (path === TP) { area = 'Turnier-Infos'; label = FL.turnier[field] || field; }
    else if (path === ZP) { area = ZTEAM.has(field) ? 'Mannschaften' : 'Bilanz'; label = FL.zahlen[field] || field; }
    else {
      area = AREA[col] || col;
      if (col === 'teams' && ['ansprechpartner', 'telefon', 'email', 'notiz'].includes(field)) area = 'Kontakte';
      subj = subjectOf(col, DOCS.get(path));
      label = (FL[col] || {})[field] || field;
    }
    const what = whatText(label, oldV, newV, field);
    return { area, text: subj ? `${subj}: ${what}` : what };
  }
  function logEntry(area, text) {
    if (MODE !== 'orga' || !S.db || S.readOnly) return;
    S.db.collection('verlauf').add({ t: Date.now(), uid: S.uid || null, bereich: area, text: short(text, 180) })
      .catch(err => { if (err && err.code === 'quota_exceeded') toast('Der Verlauf ist voll. Die Änderung selbst wurde gespeichert.'); });
  }
  function when(t) {
    const d = new Date(t); if (!t || isNaN(d)) return '';
    const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(new Date()) - day(d)) / 86400000);
    const hm = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    if (diff === 0) return 'heute ' + hm;
    if (diff === 1) return 'gestern ' + hm;
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' + hm;
  }
  function who(id) {
    if (id && S.personen[id]) return S.personen[id];
    if (id && NAMES[id] && NAMES[id].name) return NAMES[id].name;
    if (id && id === S.uid) return 'Du';
    return 'Unbekannt';
  }
  function ava(id) {
    const a = id && NAMES[id] && NAMES[id].avatar;
    return a ? `<img class="ava" src="${esc(a)}" alt="" width="20" height="20">` : '<span class="ava" aria-hidden="true"></span>';
  }
  function logHtml() {
    const last = S.verlauf[0];
    const own = S.uid && (S.personen[S.uid] || (NAMES[S.uid] && NAMES[S.uid].name));
    const needName = S.uid && !S.readOnly && NAMES[S.uid] && !own;
    const lastHtml = last
      ? `${ava(last.uid)}<b>${esc(who(last.uid))}</b><span>${esc(when(last.t))}</span><span class="log-x">${esc(last.bereich || '')}: ${esc(last.text || '')}</span>`
      : '<span>Noch keine Änderungen. Jede Änderung erscheint hier mit Name und Uhrzeit.</span>';
    let h = `<section class="log" aria-label="Verlauf"><div class="log-bar"><span class="log-k">Verlauf</span><span class="log-last">${needName ? '<span class="log-need">Leg fest, unter welchem Namen du im Verlauf erscheinst.</span>' : lastHtml}</span><button type="button" class="log-btn" data-act="log-toggle" aria-expanded="${S.logOpen}">${S.logOpen ? 'Schließen' : (needName ? 'Namen festlegen' : 'Alle Änderungen')}</button></div>`;
    if (S.logOpen) {
      const alias = (S.uid && !S.readOnly) ? `<label class="alias"><span>Dein Name im Verlauf</span><input id="f-alias" class="in" type="text" data-alias data-key="alias" value="${esc(S.personen[S.uid] || '')}" placeholder="${esc((NAMES[S.uid] && NAMES[S.uid].name) || 'z. B. Daniel')}" autocomplete="off"></label>` : '';
      const items = S.verlauf.map(e => `<li>${ava(e.uid)}<span class="who">${esc(who(e.uid))}</span><span class="t">${esc(when(e.t))}</span><span class="chip">${esc(e.bereich || '')}</span><span class="x">${esc(e.text || '')}</span></li>`).join('');
      h += `<div class="log-body">${alias}${items ? `<ol class="log-list">${items}</ol>` : '<p class="sub">Noch keine Änderungen.</p>'}<p class="sub">Zu sehen sind die letzten 80 Änderungen, die neueste oben.</p></div>`;
    }
    return h + '</section>';
  }
  function renderLog() {
    const el = $('#log'); if (!el) return;
    if (MODE !== 'orga' || S.conn !== 'live' || !S.loaded.verlauf) { if (!el.hidden) { el.hidden = true; el.innerHTML = ''; lastLog = ''; } return; }
    el.hidden = false;
    const ids = Array.from(new Set(S.verlauf.map(e => e.uid).filter(Boolean).concat(S.uid ? [S.uid] : [])));
    if (USER && ids.length) {
      USER.profiles(ids).then(ps => {
        let changed = false;
        ids.forEach(id => { const p = ps[id] || {}; const cur = NAMES[id]; if (!cur || cur.name !== (p.name || '') || cur.avatar !== (p.avatarUrl || '')) { NAMES[id] = { name: p.name || '', avatar: p.avatarUrl || '' }; changed = true; } });
        if (changed) schedule();
      }).catch(() => {});
    }
    const html = logHtml();
    if (html === lastLog) return;
    lastLog = html; swap(el, html);
  }
  function saveAlias(v) {
    if (!S.uid || !S.db) return;
    const path = 'personen/' + S.uid;
    if (same(S.personen[S.uid], v)) return;
    run(path, () => S.db.doc(path).set({ name: short(v, 40) }));
  }
  async function prune() {
    try {
      const col = S.db.collection('verlauf');
      const q = await col.orderBy('t', 'desc').limit(1000).get();
      if (q.size < 1000) return;
      const cutoff = (q.docs[q.size - 1].data() || {}).t;
      const old = await col.where('t', '<', cutoff).limit(200).get();
      for (const d of old.docs) await S.db.doc('verlauf/' + d.id).delete();
    } catch (_) {}
  }

  /* ---------- Übersicht ---------- */
  function pOverview(c) {
    const T = S.turnier || {}, Z = S.zahlen || {}, jug = jugList();
    const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
    const tile = (t, k, v, s, p, full, neg) => `<button type="button" class="tile" data-act="tab" data-tab="${t}"><span class="k">${k}</span><span class="v${neg ? ' neg' : ''}">${v}</span>${p == null ? '' : `<span class="bar${full ? ' full' : ''}"><i style="width:${Math.min(100, p)}%"></i></span>`}<span class="s">${s}</span></button>`;
    const frei = c.slots - c.besetzt, kauf = c.einkaufN - c.besorgt, todo = c.checkN - c.erledigt;
    let h = `<div class="tiles${MODE === 'helfer' ? ' four' : ''}">
      ${tile('mannschaften', 'Startgeld', `${eur(c.ein)} <small>/ ${eur(c.soll)}</small>`, c.offeneTeams ? `${plural(c.offeneTeams, 'Mannschaft', 'Mannschaften')} noch offen` : 'Alle haben bezahlt', pct(c.ein, c.soll), c.soll > 0 && c.ein >= c.soll)}
      ${tile('helfer', 'Helfer', `${c.besetzt} <small>/ ${c.slots}</small>`, frei ? `${plural(frei, 'Platz', 'Plätze')} frei` : 'Alle Schichten besetzt', pct(c.besetzt, c.slots), c.slots > 0 && !frei)}
      ${tile('einkauf', 'Einkauf', `${c.besorgt} <small>/ ${c.einkaufN}</small>`, kauf ? `${kauf} noch zu besorgen` : 'Alles besorgt', pct(c.besorgt, c.einkaufN), c.einkaufN > 0 && !kauf)}
      ${tile('checkliste', 'Checkliste', `${c.erledigt} <small>/ ${c.checkN}</small>`, todo ? `${plural(todo, 'Aufgabe', 'Aufgaben')} offen` : 'Alles erledigt', pct(c.erledigt, c.checkN), c.checkN > 0 && !todo)}
      ${MODE === 'helfer' ? '' : tile('bilanz', 'Bilanz geplant', signed(c.ergebnis), `Einnahmen ${eur(c.einnahmen)} · Ausgaben ${eur(c.ausgaben)}`, null, false, c.ergebnis < 0)}
    </div>`;
    const rows = jug.map(j => {
      const pj = c.perJ.find(x => x.key === j.key) || { n: 0 };
      return `<div class="jrow">
        ${inp('jug', 'start', j.start, { cls: 'jstart', ph: '08:30', key: `jug|${j.key}|start`, jkey: j.key, label: `Anstoß ${j.label || ''} (Uhrzeit)` })}
        ${inp('jug', 'label', j.label, { cls: 'jlabel', key: `jug|${j.key}|label`, jkey: j.key, ph: 'z. B. F-Jugend', label: 'Jugend' })}
        <span class="jmeta"><span>${plural(pj.n, 'Team', 'Teams')}</span>${unit(inp('jug', 'spielzeit', j.spielzeit, { type: 'num', cls: 'w-xs', key: `jug|${j.key}|spielzeit`, jkey: j.key, label: `Spielzeit ${j.label || ''} in Minuten` }), 'Min')}</span>
        ${delBtn(null, j.label, { act: 'del-jug', jkey: j.key })}
      </div>`;
    }).join('');
    h += `<div class="two">
      <section class="block"><div class="block-head"><h2>Ablauf am Spieltag</h2><p class="sub">Anstoß, Jugend, Spielzeit</p></div>
        ${rows ? `<div>${rows}</div>` : '<p class="empty-state">Noch keine Jugenden angelegt. Lege die erste mit „+ Jugend“ an.</p>'}
        ${addBtn('add-jug', 'Jugend')}
      </section>
      <section class="block"><div class="block-head"><h2>Bedarf</h2><p class="sub">aus Mannschaften berechnet</p></div>
        <dl class="need">
          <dt>Medaillen<small>${num(Z.medaillenProTeam)} je Mannschaft · ${plural(c.nTeams, 'Mannschaft', 'Mannschaften')}</small></dt><dd>${c.medaillen}</dd>
          <dt>Pokale<small>${num(Z.pokaleProJugend)} je Jugend</small></dt><dd>${c.pokale}</dd>
          <dt>Kuchen<small>${num(Z.kuchenProJugend)} je Jugend</small></dt><dd>${c.kuchen}</dd>
          <dt>Semmeln<small>Plan · Richtwert ${num(Z.semmelnProTeam)} je Mannschaft = ${c.semmelRicht}</small></dt><dd>${num(Z.anzahlSemmeln)}</dd>
          <dt>Butterbrezen<small>Plan</small></dt><dd>${num(Z.anzahlBrezen)}</dd>
        </dl>
      </section>
    </div>`;
    const f = (field, label, o) => `<label class="field${o && o.wide ? ' wide' : ''}"><span>${label}</span>${inp(TP, field, T[field], Object.assign({ label }, o || {}))}</label>`;
    const q = [T.ort, T.adresse].filter(Boolean).join(', ');
    h += `<section class="block"><div class="block-head"><h2>Turnier-Infos</h2><p class="sub">${MODE === 'helfer' ? 'Halle, Adresse und Spielmodus' : 'erscheinen oben im Kopf'}</p></div>
      <div class="form">${f('name', 'Turniername', { wide: true })}${f('verein', 'Verein')}${f('datum', 'Datum', { type: 'date' })}${f('ort', 'Halle')}${f('adresse', 'Adresse')}${f('modus', 'Spielmodus', { wide: true })}</div>
      ${q ? `<a class="route" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(q)}" target="_blank" rel="noopener">Route zur Halle öffnen ↗</a>` : ''}
    </section>`;
    return h;
  }

  /* ---------- Mannschaften ---------- */
  function pTeams(c) {
    const z = S.zahlen || {}, jug = jugList();
    const sumRows = c.perJ.map(p => `<tr><td>${esc(p.label || '–')}</td><td class="r">${p.n}</td><td class="r">${p.medaillen}</td><td class="r">${eur(p.soll)}</td><td class="r t-ok">${eur(p.ein)}</td><td class="r${p.offen > 0 ? ' t-warn' : ''}">${eur(p.offen)}</td></tr>`).join('');
    let h = `<section class="block"><div class="block-head"><h2>Startgeld &amp; Einnahmen</h2><p class="sub">${plural(c.nTeams, 'Mannschaft', 'Mannschaften')}, davon ${c.zahlende} zahlend</p></div>
      <div class="params">
        <label class="param"><span>Startgeld je Mannschaft</span>${unit(inp(ZP, 'startgeld', z.startgeld, { type: 'num', cls: 'w-num', label: 'Startgeld je Mannschaft' }), '€')}</label>
        <label class="param"><span>Frei, wenn Name enthält</span>${inp(ZP, 'befreit', z.befreit, { cls: 'w-mid', label: 'Startgeldfrei, wenn Name enthält' })}</label>
        <label class="param"><span>Medaillen je Mannschaft</span>${inp(ZP, 'medaillenProTeam', z.medaillenProTeam, { type: 'num', cls: 'w-xs', label: 'Medaillen je Mannschaft' })}</label>
        <label class="param"><span>Pokale je Jugend</span>${inp(ZP, 'pokaleProJugend', z.pokaleProJugend, { type: 'num', cls: 'w-xs', label: 'Pokale je Jugend' })}</label>
      </div>
      <div class="scroll"><table><thead><tr><th>Jugend</th><th class="r">Teams</th><th class="r">Medaillen</th><th class="r">Soll</th><th class="r">Eingegangen</th><th class="r">Offen</th></tr></thead>
      <tbody>${sumRows}</tbody>
      <tfoot><tr><td>Gesamt</td><td class="r">${c.nTeams}</td><td class="r">${c.medaillen}</td><td class="r">${eur(c.soll)}</td><td class="r">${eur(c.ein)}</td><td class="r">${eur(c.offen)}</td></tr></tfoot></table></div>
    </section>`;
    const keys = new Set(jug.map(j => j.key));
    const groups = jug.map(j => ({ j, items: S.teams.filter(t => t.jugend === j.key) }));
    const orphans = S.teams.filter(t => !keys.has(t.jugend));
    if (orphans.length) groups.push({ j: { key: '', label: 'Ohne Jugend' }, items: orphans });
    if (!groups.length) h += `<section class="block"><p class="empty-state">Noch keine Jugenden angelegt. Lege sie in der Übersicht unter „Ablauf am Spieltag“ an, dann kannst du hier Mannschaften eintragen.</p></section>`;
    groups.forEach(g => {
      const p = c.perJ.find(x => x.key === g.j.key);
      const rows = g.items.map((t, i) => {
        const fee = TC.fee(t, z);
        const segs = ['Ja', 'Nein', 'Frei'].map(v => `<button type="button" data-act="pay" data-path="${esc(t.path)}" data-v="${v}" aria-pressed="${t.bezahlt === v}"${S.readOnly ? ' disabled' : ''}>${PAY[v]}</button>`).join('');
        return `<div class="trow"><span class="tno">${i + 1}</span>${inp(t.path, 'name', t.name, { cls: 'tname', ph: 'Vereinsname', label: 'Mannschaft' })}<div class="seg" role="group" aria-label="${esc('Startgeld ' + (t.name || ''))}">${segs}</div><span class="fee${fee ? '' : ' frei'}">${fee ? eur(fee) : 'frei'}</span>${delBtn(t.path, t.name)}</div>`;
      }).join('');
      h += `<section class="block">
        <div class="jhead">
          <div class="kick"><b>${esc(g.j.start || '–')}</b><span>Anstoß</span></div>
          <div><h3>${esc(g.j.label || 'Jugend')}</h3><p class="sub">${plural(p ? p.n : g.items.length, 'Mannschaft', 'Mannschaften')}${g.j.spielzeit ? ` · ${g.j.spielzeit} Min Spielzeit` : ''}${p ? ` · ${p.medaillen} Medaillen · ${plural(p.pokale, 'Pokal', 'Pokale')}` : ''}</p></div>
          ${p ? `<div class="money"><b>${eur(p.ein)} / ${eur(p.soll)}</b>${p.offen > 0 ? `${eur(p.offen)} offen` : 'komplett'}</div>` : ''}
        </div>
        ${rows ? `<div class="rows">${rows}</div>` : '<p class="empty-state">Noch keine Mannschaft eingetragen.</p>'}
        ${g.j.key ? addBtn('add-team', 'Mannschaft', ` data-j="${esc(g.j.key)}"`) : ''}
      </section>`;
    });
    return h;
  }

  /* ---------- Helfer ---------- */
  function pHelfer(c) {
    const groups = [];
    S.helfer.forEach(s => { let g = groups.find(x => x.name === (s.bereich || '')); if (!g) { g = { name: s.bereich || '', items: [] }; groups.push(g); } g.items.push(s); });
    const frei = c.slots - c.besetzt;
    let h = `<section class="block"><div class="block-head"><h2>Helferplan</h2><p class="sub">${c.besetzt} von ${c.slots} Plätzen besetzt${frei ? ` · ${plural(frei, 'Platz', 'Plätze')} frei (gelb markiert)` : ''}</p></div>${MODE === 'helfer' && frei ? '<p class="sub" style="margin:-6px 0 14px">Du willst eine freie Schicht übernehmen? Sag der Turnierleitung Bescheid.</p>' : ''}`;
    if (!groups.length) return h + '<p class="empty-state">Noch keine Schichten angelegt.</p></section>';
    h += '<div class="hgrid">' + groups.map(g => {
      const n = g.items.reduce((m, s) => m + (String(s.p1 || '').trim() ? 1 : 0) + (String(s.p2 || '').trim() ? 1 : 0), 0);
      return `<article class="hcard"><h3>${esc(g.name)}<small>${n}/${g.items.length * 2}</small></h3>${g.items.map(s => `<div class="shift"><span class="time">${esc(s.schicht)}</span><div class="pair">${['p1', 'p2'].map((k, i) => inp(s.path, k, s[k], { ph: S.readOnly ? 'frei' : 'Person ' + (i + 1), cls: String(s[k] || '').trim() ? '' : 'open', label: `${g.name} ${s.schicht} Person ${i + 1}` })).join('')}</div></div>`).join('')}</article>`;
    }).join('') + '</div></section>';
    return h;
  }

  /* ---------- Einkauf ---------- */
  function pEinkauf(c) {
    const z = S.zahlen || {};
    const kats = KATS.slice();
    S.einkauf.forEach(e => { if (e.kategorie && !kats.includes(e.kategorie)) kats.push(e.kategorie); });
    const offen = c.einkaufN - c.besorgt;
    let h = `<section class="block"><div class="block-head"><h2>Einkauf &amp; Kiosk</h2><p class="sub">${offen ? `${offen} von ${c.einkaufN} noch zu besorgen` : `Alle ${c.einkaufN} besorgt`} · Haken setzen, wenn besorgt</p></div>`;
    kats.forEach(k => {
      const items = S.einkauf.filter(e => (e.kategorie || 'Sonstiges') === k);
      const done = items.filter(e => e.besorgt === true).length;
      const rows = items.map(e => {
        let men, hint = '';
        if (e.auto === 'kuchen') { men = `<span class="calc men" title="${num(z.kuchenProJugend)} je Jugend">${c.kuchen}</span>`; hint = `Automatisch: ${num(z.kuchenProJugend)} je Jugend`; }
        else if (e.auto === 'semmeln') { men = inp(ZP, 'anzahlSemmeln', z.anzahlSemmeln, { type: 'num', cls: 'men', label: 'Menge Semmeln' }); hint = `Richtwert ${num(z.semmelnProTeam)} je Mannschaft = ${c.semmelRicht} · zählt auch in der Bilanz`; }
        else if (e.auto === 'brezen') { men = inp(ZP, 'anzahlBrezen', z.anzahlBrezen, { type: 'num', cls: 'men', label: 'Menge Butterbrezen' }); hint = 'zählt auch in der Bilanz'; }
        else men = inp(e.path, 'menge', e.menge, { type: 'num', cls: 'men', label: 'Menge ' + (e.artikel || '') });
        return `<div class="erow${e.besorgt ? ' done' : ''}">${chk(e.path, 'besorgt', e.besorgt, 'Besorgt: ' + (e.artikel || ''))}${inp(e.path, 'artikel', e.artikel, { cls: 'art', ph: 'Artikel', label: 'Artikel' })}${men}${inp(e.path, 'einheit', e.einheit, { cls: 'ein', ph: 'Einheit', label: 'Einheit ' + (e.artikel || '') })}${inp(e.path, 'zustaendig', e.zustaendig, { cls: 'zus', ph: 'Wer besorgt?', label: 'Zuständig für ' + (e.artikel || '') })}${delBtn(e.path, e.artikel)}${hint ? `<p class="hint">${esc(hint)}</p>` : ''}</div>`;
      }).join('');
      if (!items.length && !KATS.includes(k)) return;
      h += `<div class="ghead"><h3>${esc(k)}</h3><span class="sub">${items.length ? `${done}/${items.length} besorgt` : 'leer'}</span></div>
        ${rows ? `<div class="rows">${rows}</div>` : ''}${addBtn('add-einkauf', 'Artikel', ` data-k="${esc(k)}"`)}`;
    });
    return h + '</section>';
  }

  /* ---------- Checkliste ---------- */
  function pCheck(c) {
    const todo = c.checkN - c.erledigt;
    const rows = S.checkliste.map(t => `<div class="crow${t.erledigt ? ' done' : ''}">${chk(t.path, 'erledigt', t.erledigt, 'Erledigt: ' + (t.aufgabe || ''))}${inp(t.path, 'aufgabe', t.aufgabe, { cls: 'task', ph: 'Aufgabe', label: 'Aufgabe' })}${inp(t.path, 'zustaendig', t.zustaendig, { cls: 'zus', ph: 'Zuständig', label: 'Zuständig für ' + (t.aufgabe || '') })}${delBtn(t.path, t.aufgabe)}</div>`).join('');
    return `<section class="block"><div class="block-head"><h2>Checkliste</h2><p class="sub">${c.checkN ? (todo ? `${todo} von ${c.checkN} offen` : 'Alles erledigt') : 'leer'}</p></div>
      ${rows ? `<div class="rows">${rows}</div>` : '<p class="empty-state">Noch keine Aufgaben. Lege die erste mit „+ Aufgabe“ an.</p>'}
      ${addBtn('add-check', 'Aufgabe')}</section>`;
  }

  /* ---------- Kontakte ---------- */
  function pKontakte() {
    const tel = MODE !== 'helfer';
    const rc = tel ? 'krow' : 'krow nt';
    const head = `<div class="${rc} colhead" aria-hidden="true"><span>%N</span><span>Ansprechpartner</span>${tel ? '<span>Telefon</span>' : ''}<span>E-Mail</span><span>Notiz</span><span></span></div>`;

  const PANELS = { uebersicht: pOverview, mannschaften: pTeams, helfer: pHelfer, einkauf: pEinkauf, checkliste: pCheck, kontakte: pKontakte, bilanz: pBilanz };

  /* ---------- Rendern ---------- */
  function allLoaded() { return S.loaded[TP] && S.loaded[ZP] && COLS.every(c => S.loaded[c]); }
  function panelHtml(c) {
    if (MODE === 'helfer' && S.conn === 'none') return `<section class="block notice"><h2>Helfer-Ansicht nicht geladen</h2><p>Die Daten konnten gerade nicht geladen werden. Lade die Seite bitte neu.</p></section>`;
    if (S.conn === 'none' || S.conn === 'revoked') return `<section class="block notice"><h2>Turnierdaten nicht erreichbar</h2><p>Die Planung liegt online bei Claude und erscheint, wenn du diesen Link angemeldet öffnest und Zugriff auf die Seite hast. Bitte die Turnierleitung, dich einzuladen.</p></section>`;
    if (!c) return `<section class="block notice"><h2>Lade Turnierdaten …</h2><p>Mannschaften, Helferplan, Einkauf, Checkliste, Kontakte und Bilanz erscheinen gleich hier.</p></section>`;
    return PANELS[tab](c);
  }
  function renderHeader() {
    const T = S.turnier || {};
    const d = T.datum ? new Date(T.datum + 'T12:00:00') : null, ok = d && !isNaN(d);
    const cd = kickoff() ? '<div class="cd" aria-hidden="true"><span><b data-cd="d">–</b><i data-cd="dl">Tage</i></span><span><b data-cd="h">–</b><i>Std</i></span><span><b data-cd="m">–</b><i>Min</i></span><span><b data-cd="s">–</b><i>Sek</i></span></div><p class="cd-note" data-cd="note"></p>' : '';
    const dStr = ok ? d.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
    const html = `<div class="wrap hwrap"><div><div class="toprow"><span class="eyebrow">${esc(T.verein || '')}${T.verein ? ' · ' : ''}${MODE === 'helfer' ? 'Helfer-Ansicht' : 'Turnierplanung'}</span><span id="status" class="live" role="status" aria-live="polite"></span></div>
      <h1>${esc(T.name || 'Hallenturnier')}</h1>
      <p class="meta">${dStr ? `<span>${esc(dStr)}</span>` : ''}${T.ort ? `<span>${esc(T.ort)}</span>` : ''}${T.adresse ? `<span>${esc(T.adresse)}</span>` : ''}${T.modus ? `<span>${esc(T.modus)}</span>` : ''}</p></div>
      ${cd ? `<div class="count" id="count">${cd}</div>` : ''}</div>`;
    if (html !== lastHdr) { lastHdr = html; $('#hdr').innerHTML = html; tick(); }
    renderStatus();
  }
  /* Countdown bis zum ersten Anstoß, läuft sekundengenau */
  function kickoff() {
    const T = S.turnier || {};
    if (!T.datum || !/^\d{4}-\d{2}-\d{2}$/.test(T.datum)) return null;
    const starts = jugList().map(j => String(j.start || '').trim()).filter(s => /^\d{1,2}:\d{2}$/.test(s)).map(s => s.padStart(5, '0')).sort();
    const st = starts[0] || '00:00';
    const d = new Date(`${T.datum}T${st}:00`);
    return isNaN(d) ? null : { d, st };
  }
  function tick() {
    const el = $('#count'); if (!el) return;
    const k = kickoff(); if (!k) return;
    const set = (n, v) => { const x = el.querySelector(`[data-cd="${n}"]`); if (x && x.textContent !== v) x.textContent = v; };
    const now = Date.now(), ms = k.d.getTime() - now;
    if (ms <= 0) {
      const end = new Date(k.d); end.setHours(23, 59, 59, 999);
      el.classList.add('done');
      set('note', now <= end.getTime() ? 'Turnier läuft – viel Erfolg!' : 'Turnier vorbei – danke an alle Helfer!');
      return;
    }
    el.classList.remove('done');
    const s = Math.floor(ms / 1000), days = Math.floor(s / 86400);
    set('d', String(days)); set('dl', days === 1 ? 'Tag' : 'Tage');
    set('h', String(Math.floor(s % 86400 / 3600)).padStart(2, '0'));
    set('m', String(Math.floor(s % 3600 / 60)).padStart(2, '0'));
    set('s', String(s % 60).padStart(2, '0'));
    set('note', `bis zum Anpfiff · ${k.st} Uhr`);
    el.setAttribute('aria-label', `Noch ${days} Tage, ${Math.floor(s % 86400 / 3600)} Stunden und ${Math.floor(s % 3600 / 60)} Minuten bis zum Anpfiff`);
  }
  setInterval(tick, 1000);
  function renderStatus() {
    const el = $('#status'); if (!el) return;
    let cls = '', txt;
    if (S.conn === 'static') txt = S.stand ? `Stand: ${when(S.stand)}` : 'Stand unbekannt';
    else if (S.conn === 'connecting') txt = MODE === 'helfer' ? 'Lade …' : 'Verbinde …';
    else if (S.conn === 'none') { txt = 'Nicht verbunden'; cls = 'off'; }
    else if (S.conn === 'revoked') { txt = 'Zugriff beendet'; cls = 'off'; }
    else if (S.saving > 0) { txt = 'Speichert …'; cls = 'busy'; }
    else if (S.readOnly) { txt = 'Live · nur ansehen'; cls = 'on'; }
    else { txt = 'Live · gespeichert'; cls = 'on'; }
    el.className = 'live ' + cls;
    el.innerHTML = `<i aria-hidden="true"></i>${txt}`;
  }
  function renderTabs(c) {
    const b = c ? { mannschaften: c.offeneTeams, helfer: c.slots - c.besetzt, einkauf: c.einkaufN - c.besorgt, checkliste: c.checkN - c.erledigt } : {};
    const html = TABS.map(([k, l]) => `<button type="button" class="tab" role="tab" id="tab-${k}" aria-selected="${k === tab}" aria-controls="panel" data-act="tab" data-tab="${k}">${l}${b[k] > 0 ? `<span class="badge" title="offen">${b[k]}</span>` : ''}</button>`).join('');
    if (html !== lastTabs) {
      lastTabs = html; $('#tabbar').innerHTML = html;
      const act = $('#tab-' + tab), bar = $('#tabbar');
      if (act && bar) { const l = act.offsetLeft - 16, r = act.offsetLeft + act.offsetWidth + 16; if (l < bar.scrollLeft || r > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = Math.max(0, l); }
    }
    $('#panel').setAttribute('aria-labelledby', 'tab-' + tab);
  }
  function swap(el, html) {
    const a = document.activeElement;
    let st = null;
    if (a && el.contains(a) && a.dataset && a.dataset.key) {
      st = { key: a.dataset.key, val: a.value, dirty: a.dataset.dirty === '1', s: null, e: null };
      try { st.s = a.selectionStart; st.e = a.selectionEnd; } catch (_) {}
    }
    el.innerHTML = html;
    const find = k => el.querySelector(`[data-key="${CSS.escape(k)}"]`);
    if (st) {
      const n = find(st.key);
      if (n) {
        if (st.dirty) { n.value = st.val; n.dataset.dirty = '1'; }
        n.focus({ preventScroll: true });
        try { if (st.s != null) n.setSelectionRange(st.s, st.e); } catch (_) {}
      }
    }
    if (pendingFocus) { const n = find(pendingFocus); if (n) { pendingFocus = null; n.focus(); } }
  }
  function render() {
    if (composing) return;
    const c = ((S.conn === 'live' || S.conn === 'static') && allLoaded()) ? TC.calc(S) : null;
    renderHeader(); renderTabs(c); renderLog();
    const html = panelHtml(c);
    const sig = tab + '|' + S.readOnly + '|' + html;
    if (sig === lastPanel && !pendingFocus) return;
    lastPanel = sig;
    swap($('#panel'), html);
  }
  function schedule() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = 0; render(); }); }
  function force() { lastPanel = ''; schedule(); }

  /* ---------- Reiter ---------- */
  function initialTab() {
    const h = (location.hash || '').slice(1);
    if (TABS.some(t => t[0] === h)) return h;
    try { const s = localStorage.getItem('hsv-planung-tab'); if (TABS.some(t => t[0] === s)) return s; } catch (_) {}
    return 'uebersicht';
  }
  function setTab(t) {
    if (!TABS.some(x => x[0] === t) || t === tab) return;
    tab = t;
    try { localStorage.setItem('hsv-planung-tab', t); } catch (_) {}
    try { history.replaceState(null, '', '#' + t); } catch (_) {}
    lastPanel = ''; render();
    const y = $('#tabs').offsetTop;
    if (window.scrollY > y) window.scrollTo(0, y);
  }
  window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));

  /* ---------- Speichern ---------- */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function enqueue(path, fn) { const next = (queues.get(path) || Promise.resolve()).catch(() => {}).then(fn); queues.set(path, next); return next; }
  async function run(path, fn) {
    if (!S.db || S.readOnly) return;
    S.saving++; renderStatus();
    try {
      await enqueue(path, async () => {
        try { await fn(); }
        catch (err) { if (err && err.code === 'unavailable') { await sleep(300 + Math.random() * 700); await fn(); } else throw err; }
      });
    } catch (err) { onWriteErr(err); }
    finally { S.saving--; renderStatus(); }
  }
  function write(path, data, create) {
    return run(path, () => {
      const ref = S.db.doc(path);
      if (create) return ref.set(data);
      if (DOCS.has(path)) return ref.update(data);
      if (path === TP || path === ZP) return ref.set(data);
      return Promise.resolve(); // Eintrag wurde inzwischen gelöscht
    });
  }
  function removeDoc(path) { return run(path, () => S.db.doc(path).delete()); }
  function add(col, data, field) { const ref = S.db.collection(col).doc(); pendingFocus = ref.path + '|' + field; return write(ref.path, data, true); }
  function onWriteErr(err) {
    const c = err && err.code;
    if (c === 'invalid_argument' || c === 'not_granted') {
      if (!S.writeKnown) { S.readOnly = true; force(); toast('Du kannst diese Planung nur ansehen. Bearbeiten kann, wer zum Bearbeiten eingeladen ist.'); }
      else toast('Diese Änderung wurde nicht gespeichert.');
    } else if (c === 'quota_exceeded') toast('Der Speicher der Planung ist voll. Lösche alte Einträge und versuch es nochmal.');
    else if (c === 'revoked') { S.readOnly = true; S.conn = 'revoked'; force(); }
    else toast('Änderung nicht gespeichert. Prüfe die Verbindung und versuch es nochmal.');
  }
  let toastTimer = 0;
  function toast(msg) {
    let el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'alert'); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 4500);
  }

  function commit(el) {
    if (S.readOnly || !S.db) return;
    const path = el.dataset.path, field = el.dataset.field, type = el.dataset.type;
    let v;
    if (type === 'bool') v = el.checked;
    else if (type === 'num') {
      const t = el.value.trim().replace(/\s/g, '');
      if (t === '') v = null;
      else {
        v = Number(t.replace(',', '.'));
        if (!isFinite(v)) { el.dataset.dirty = ''; toast('Bitte eine Zahl eingeben, z. B. 2,50.'); force(); return; }
      }
    } else v = el.value.trim();
    el.dataset.dirty = '';
    if (path === 'jug') {
      const arr = jugList().map(j => Object.assign({}, j));
      const j = arr.find(x => x.key === el.dataset.jkey); if (!j) return;
      const oldV = j[field]; if (same(oldV, v)) return;
      const name = j.label || 'Jugend';
      j[field] = v; write(TP, { jugenden: arr });
      logEntry('Ablauf', `${name}: ${whatText(FL.jug[field] || field, oldV, v, field)}`);
      return;
    }
    const oldV = (DOCS.get(path) || {})[field];
    if (same(oldV, v)) return;
    const d = describe(path, field, oldV, v);
    write(path, { [field]: v });
    logEntry(d.area, d.text);
  }
  function armOrRun(b, fn) {
    if (b.classList.contains('arm')) { fn(); return; }
    b.classList.add('arm'); b.textContent = 'Löschen?';
    setTimeout(() => { if (b.isConnected) { b.classList.remove('arm'); b.innerHTML = '&times;'; } }, 3500);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'tab') { setTab(b.dataset.tab); return; }
    if (a === 'log-toggle') { S.logOpen = !S.logOpen; if (S.logOpen && !S.readOnly) pendingFocus = (S.uid && !S.personen[S.uid] && !(NAMES[S.uid] && NAMES[S.uid].name)) ? 'alias' : pendingFocus; schedule(); return; }
    if (S.readOnly || !S.db) return;
    if (a === 'pay') {
      const path = b.dataset.path, v = b.dataset.v, t = DOCS.get(path) || {};
      if (t.bezahlt === v) return;
      const d = describe(path, 'bezahlt', t.bezahlt, v);
      write(path, { bezahlt: v }); logEntry(d.area, d.text);
    }
    else if (a === 'add-team') { add('teams', { jugend: b.dataset.j, name: '', bezahlt: 'Nein', order: nextOrder(S.teams) }, 'name'); logEntry('Mannschaften', `Neue Mannschaft in ${jugLabel(b.dataset.j)} angelegt`); }
    else if (a === 'add-einkauf') { add('einkauf', { kategorie: b.dataset.k, artikel: '', menge: null, einheit: '', zustaendig: '', besorgt: false, order: nextOrder(S.einkauf) }, 'artikel'); logEntry('Einkauf', `Neuer Artikel in ${b.dataset.k} angelegt`); }
    else if (a === 'add-check') { add('checkliste', { aufgabe: '', zustaendig: '', erledigt: false, order: nextOrder(S.checkliste) }, 'aufgabe'); logEntry('Checkliste', 'Neue Aufgabe angelegt'); }
    else if (a === 'add-kontakt') { add('kontakte', { stelle: '', ansprechpartner: '', telefon: '', email: '', notiz: '', order: nextOrder(S.kontakte) }, 'stelle'); logEntry('Kontakte', 'Neuer Kontakt angelegt'); }
    else if (a === 'add-posten') { add('posten', { art: b.dataset.art, bezeichnung: '', betrag: null, order: nextOrder(S.posten) }, 'bezeichnung'); logEntry('Bilanz', b.dataset.art === 'ein' ? 'Weitere Einnahme angelegt' : 'Weitere Ausgabe angelegt'); }
    else if (a === 'add-jug') {
      const arr = jugList().map(j => Object.assign({}, j));
      const key = 'j' + Date.now().toString(36);
      arr.push({ key, label: '', start: '', spielzeit: null });
      pendingFocus = `jug|${key}|label`;
      write(TP, { jugenden: arr });
      logEntry('Ablauf', 'Neue Jugend angelegt');
    }
    else if (a === 'del') armOrRun(b, () => {
      const path = b.dataset.path, col = path.split('/')[0];
      const subj = subjectOf(col, DOCS.get(path));
      removeDoc(path); logEntry(AREA[col] || col, `${NOUN[col] || 'Eintrag'} entfernt: ${subj}`);
    });
    else if (a === 'del-jug') armOrRun(b, () => {
      const j = jugList().find(x => x.key === b.dataset.jkey);

  document.addEventListener('keydown', e => { const el = e.target; if (e.key === 'Enter' && el.matches && el.matches('input[data-bind], input[data-alias]')) el.blur(); });
  document.addEventListener('compositionstart', () => { composing = true; });
  document.addEventListener('compositionend', () => { composing = false; schedule(); });

  /* ---------- Live-Daten ---------- */
  function subscribe() {
    const onErr = e => {
      if (e && e.code === 'revoked') { S.readOnly = true; S.conn = 'revoked'; force(); }
      else toast('Die Live-Verbindung ist unterbrochen. Lade die Seite neu.');
    };
    [TP, ZP].forEach(p => S.db.doc(p).onSnapshot(s => {
      const d = s.exists ? s.data() : null;
      if (d) DOCS.set(p, d); else DOCS.delete(p);
      if (p === TP) S.turnier = d; else S.zahlen = d;
      S.loaded[p] = true; schedule();
    }, onErr));
    COLS.forEach(col => S.db.collection(col).onSnapshot(q => {
      for (const k of Array.from(DOCS.keys())) if (k.startsWith(col + '/')) DOCS.delete(k);
      S[col] = q.docs.map(d => { const x = d.data() || {}; const path = col + '/' + d.id; DOCS.set(path, x); return Object.assign({}, x, { id: d.id, path }); }).sort(byOrder);
      S.loaded[col] = true; schedule();
    }, onErr));
    S.db.collection('verlauf').orderBy('t', 'desc').limit(80).onSnapshot(q => {
      S.verlauf = q.docs.map(d => Object.assign({ id: d.id }, d.data() || {}));
      S.loaded.verlauf = true; schedule();
    }, onErr);
    S.db.collection('personen').onSnapshot(q => {
      const m = {}; q.docs.forEach(d => { const x = d.data() || {}; if (x.name) m[d.id] = String(x.name); });
      S.personen = m; schedule();
    }, onErr);
  }

  async function loadHelfer() {
    S.readOnly = true;
    try {
      const r = await fetch('daten.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      S.turnier = d.turnier || null; S.zahlen = d.zahlen || {}; S.stand = d.stand || null;
      COLS.forEach(col => { S[col] = (Array.isArray(d[col]) ? d[col] : []).map(x => Object.assign({}, x, { path: col + '/' + x.id })).sort(byOrder); S.loaded[col] = true; });
      S.loaded[TP] = S.loaded[ZP] = true; S.conn = 'static';
    } catch (_) { S.conn = 'none'; }
    force();
  }

  render();
  (async () => {
    if (MODE === 'helfer') { loadHelfer(); return; }
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { S.conn = 'none'; force(); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (_) {}
    if (!db) { S.conn = 'none'; force(); return; }
    S.db = db; S.conn = 'live';
    if (user) {
      USER = user;
      try { S.uid = await user.id(); } catch (_) {}
      try { const w = await user.can('data.write'); if (w === false) S.readOnly = true; if (w === true) S.writeKnown = true; } catch (_) {}
    }
    subscribe(); force();
    if (user) { try { if (await user.isOwner()) prune(); } catch (_) {} }
  })();
})();
</script>

</body>
</html>
